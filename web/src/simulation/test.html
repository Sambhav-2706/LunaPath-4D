
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaPath 4D - Autonomous Rover Simulation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b1018;
            color: #e8edf5;
            font-family: Arial, sans-serif;
        }

        #simulation {
            width: 100%;
            height: 100%;
        }

        #mission-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 290px;
            padding: 18px;
            background: rgba(12, 19, 30, 0.94);
            border: 1px solid #34445b;
            border-radius: 12px;
            z-index: 10;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        #mission-panel h2 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #91a0b5;
            font-size: 11px;
            margin-bottom: 17px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #mission-status {
            color: #f5c76b;
            font-weight: bold;
            font-size: 12px;
        }

        .metric {
            margin: 12px 0;
        }

        .metric-label {
            display: flex;
            justify-content: space-between;
            color: #aab7c8;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .metric-value {
            color: #ffffff;
            font-weight: bold;
        }

        .progress-track {
            height: 7px;
            background: #263448;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #35e6a1;
            transition: width 0.15s linear;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 18px;
        }

        button {
            border: 1px solid #465b75;
            border-radius: 7px;
            padding: 10px;
            color: white;
            background: #26374e;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover:not(:disabled) {
            background: #38516f;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #start-btn {
            background: #176b4b;
            border-color: #238b63;
        }

        #start-btn:hover:not(:disabled) {
            background: #20865e;
        }

        #stop-btn {
            background: #762f37;
            border-color: #a4434e;
        }

        .divider {
            height: 1px;
            background: #34445b;
            margin: 15px 0;
        }

        .mission-info {
            color: #91a0b5;
            font-size: 11px;
            line-height: 1.8;
        }

        .mission-info span {
            color: #e8edf5;
            float: right;
        }

        #keyboard-hint {
            position: absolute;
            bottom: 16px;
            left: 18px;
            color: #aab7c8;
            background: rgba(12, 19, 30, 0.85);
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 11px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="simulation"></div>

    <div id="mission-panel">
        <h2>LunaPath 4D</h2>
        <div class="subtitle">AUTONOMOUS ROVER CONTROL</div>

        <div class="status-row">
            <span class="mission-info">MISSION STATUS</span>
            <span id="mission-status">INITIALIZING</span>
        </div>

        <div class="metric">
            <div class="metric-label">
                <span>MISSION PROGRESS</span>
                <span id="progress-text" class="metric-value">0.0%</span>
            </div>

            <div class="progress-track">
                <div id="progress-fill"></div>
            </div>
        </div>

        <div class="metric">
            <div class="metric-label">
                <span>DISTANCE TRAVELLED</span>
                <span id="distance-travelled" class="metric-value">0 m</span>
            </div>
        </div>

        <div class="metric">
            <div class="metric-label">
                <span>DISTANCE REMAINING</span>
                <span id="distance-remaining" class="metric-value">0 m</span>
            </div>
        </div>

        <div class="metric">
            <div class="metric-label">
                <span>ROVER SPEED</span>
                <span id="rover-speed" class="metric-value">5 m/s</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="mission-info">
            Navigation mode <span id="navigation-mode">BALANCED</span><br>
            Route nodes <span id="route-nodes">0</span><br>
            Detected hazards <span id="hazard-count">0</span><br>
            Replanning events <span id="replanning-count">0</span>
        </div>

        <div class="button-grid">
            <button id="start-btn" disabled>START</button>
            <button id="pause-btn" disabled>PAUSE</button>
            <button id="resume-btn" disabled>RESUME</button>
            <button id="stop-btn" disabled>STOP</button>
        </div>
    </div>

    <div id="keyboard-hint">
        Manual controls: WASD / Arrow Keys
    </div>

    <script type="module" src="./test.js"></script>
</body>
</html>
